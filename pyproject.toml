[project]
name = "fl-multiplayer"
version = "0.2.0"
description = "Real-time sync of tempo, mixer and channel rack between two FL Studio instances (unofficial)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "websockets>=13",
]

[project.scripts]
flmp = "flmp_relay.cli:entry"
flmp-server = "flmp_server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fl_script/flmp_core", "relay/flmp_relay", "server/flmp_server"]

[tool.hatch.build.targets.wheel.force-include]
"fl_script/device_FLMultiplayer.py" = "flmp_relay/fl_script/device_FLMultiplayer.py"
"fl_script/piano_roll" = "flmp_relay/fl_script/piano_roll"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["fl_script", "relay", "server"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN", "RUF", "SIM"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]
